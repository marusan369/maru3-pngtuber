<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム美容＆演出フィルター v5</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
    }

    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transition: filter 0.25s ease, transform 0.2s ease;
    }

    video.mirror {
      transform: scaleX(-1);
    }

    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0, 0, 0, 0.8);
      padding: 14px 18px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      max-width: 95vw;
      backdrop-filter: blur(8px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .controls.hidden {
      opacity: 0;
      transform: translate(-50%, 20px);
      pointer-events: none;
    }

    .ui-hint {
      position: absolute;
      top: 15px;
      z-index: 5;
      background: rgba(0, 0, 0, 0.5);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      color: #ddd;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .ui-hint.hidden {
      opacity: 0;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }

    button {
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      background: #333;
      color: white;
      font-weight: bold;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.92);
    }

    button.active {
      background: #ff4081;
      color: white;
      box-shadow: 0 0 10px rgba(255, 64, 129, 0.5);
    }

    /* 遊び心ボタン用の色分け */
    button.fun-btn.active {
      background: #7c4dff;
      box-shadow: 0 0 10px rgba(124, 77, 255, 0.6);
    }

    button.mirror-on {
      background: #00e676;
      color: #000;
    }

    .label {
      font-size: 11px;
      color: #ccc;
      margin-bottom: 4px;
      text-align: center;
    }
  </style>
</head>

<body onclick="toggleUI(event)">

  <div class="ui-hint" id="uiHint">💡 画面タップでメニュー開閉</div>

  <video id="webcam" autoplay playsinline muted class="mirror"></video>

  <div class="controls" id="controlsUI">
    
    <!-- 美肌系 -->
    <div>
      <div class="label">✨ 美肌・リングライト</div>
      <div class="button-group">
        <button onclick="setFilter('off', this)" class="active">OFF</button>
        <button onclick="setFilter('ring', this)">リングライト</button>
        <button onclick="setFilter('studiolight', this)">美白スタジオ</button>
        <button onclick="setFilter('clear', this)">透明感UP</button>
      </div>
    </div>

    <!-- 遊び心演出系 -->
    <div>
      <div class="label">🎨 演出・遊び心</div>
      <div class="button-group">
        <button onclick="setFilter('mono', this)" class="fun-btn">モノクロ</button>
        <button onclick="setFilter('retro', this)" class="fun-btn">エモレトロ</button>
      </div>
    </div>

    <!-- 機能切り替え -->
    <div class="button-group" style="margin-top: 4px;">
      <button id="mirrorBtn" onclick="toggleMirror(event)" class="mirror-on">ミラー：ON</button>
      <button onclick="toggleCamera(event)">カメラ切替</button>
      <button onclick="hideUIExplicit(event)" style="background: #555;">画面を隠す ✕</button>
    </div>

  </div>

  <script>
    const video = document.getElementById('webcam');
    const mirrorBtn = document.getElementById('mirrorBtn');
    const controlsUI = document.getElementById('controlsUI');
    const uiHint = document.getElementById('uiHint');
    let currentFacingMode = 'user';
    let currentStream = null;

    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      try {
        const constraints = {
          video: {
            facingMode: currentFacingMode,
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        };

        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
      } catch (err) {
        alert('カメラ起動エラー: ' + err.message);
      }
    }

    function toggleUI(e) {
      if (e.target.tagName === 'BUTTON' || e.target.closest('.controls')) {
        return;
      }
      controlsUI.classList.toggle('hidden');
      uiHint.classList.toggle('hidden');
    }

    function hideUIExplicit(e) {
      e.stopPropagation();
      controlsUI.classList.add('hidden');
      uiHint.classList.add('hidden');
    }

    function toggleMirror(e) {
      e.stopPropagation();
      video.classList.toggle('mirror');
      const isMirror = video.classList.contains('mirror');
      
      if (isMirror) {
        mirrorBtn.textContent = 'ミラー：ON';
        mirrorBtn.classList.add('mirror-on');
      } else {
        mirrorBtn.textContent = 'ミラー：OFF';
        mirrorBtn.classList.remove('mirror-on');
      }
    }

    function toggleCamera(e) {
      e.stopPropagation();
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera();
    }

    // --- フィルター設定（美肌 ＋ 演出系） ---
    function setFilter(type, btnElement) {
      // 画面上の全ボタンのアクティブ状態を一旦解除
      const allButtons = document.querySelectorAll('.button-group button');
      allButtons.forEach(b => b.classList.remove('active'));

      if (btnElement) {
        btnElement.classList.add('active');
      }

      switch (type) {
        case 'off':
          video.style.filter = 'none';
          break;

        // --- 美肌系 ---
        case 'ring':
          video.style.filter = 'brightness(1.15) contrast(0.92) saturate(1.05)';
          break;

        case 'studiolight':
          video.style.filter = 'brightness(1.28) contrast(0.88) saturate(0.98) blur(0.3px)';
          break;

        case 'clear':
          video.style.filter = 'brightness(1.12) contrast(1.02) saturate(1.18) hue-rotate(-3deg)';
          break;

        // --- 遊び心系（思い切った加工） ---
        case 'mono':
          // ドラマチックなモノクロ：白黒にしつつコントラストを強めて影をカッコよく見せる
          video.style.filter = 'grayscale(100%) brightness(1.1) contrast(1.35)';
          break;

        case 'retro':
          // エモレトロ：しっかりセピア色をのせつつ、古い写真のように色味をくすませる
          video.style.filter = 'sepia(0.65) brightness(1.08) contrast(1.15) saturate(1.3)';
          break;

        default:
          video.style.filter = 'none';
      }
    }

    startCamera();
  </script>
</body>
</html>
