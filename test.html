<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ツイキャス用 アニメPNGメーカー</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: #121216;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 16px;
      margin: 0 0 16px 0;
      color: #ff4081;
    }

    .preview-box {
      width: 300px;
      height: 300px;
      border-radius: 12px;
      border: 2px dashed rgba(255, 255, 255, 0.2);
      background-color: #1a1a20;
      background-image: 
        linear-gradient(45deg, #222 25%, transparent 25%), 
        linear-gradient(-45deg, #222 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #222 75%), 
        linear-gradient(-45deg, transparent 75%, #222 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      overflow: hidden;
    }

    canvas, img.result-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .controls {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      text-align: center;
    }

    .file-label {
      background: #3f51b5;
      color: #fff;
    }

    input[type="file"] {
      display: none;
    }

    .pattern-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .pattern-btn {
      padding: 10px 4px;
      background: #222;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #ccc;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .pattern-btn.active {
      background: #ff4081;
      border-color: #ff4081;
      color: #fff;
    }

    .generate-btn {
      background: #00e676;
      color: #000;
    }

    .generate-btn:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }

    #status {
      font-size: 12px;
      color: #ffb74d;
      text-align: center;
      min-height: 18px;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/upng-js@2.1.0/UPNG.js"></script>
</head>
<body>

  <h1>🎬 アニメPNGメーカー</h1>

  <div class="preview-box" id="previewContainer">
    <canvas id="cv" width="400" height="400"></canvas>
  </div>

  <div class="controls">
    <!-- 1. 画像選択 -->
    <label class="btn file-label">
      📁 1. 画像をえらぶ
      <input type="file" id="fileInput" accept="image/*">
    </label>

    <!-- 2. 動きの選択 -->
    <div class="pattern-grid">
      <button class="pattern-btn active" onclick="selectPattern('updown', this)">🎈 ぷかぷか</button>
      <button class="pattern-btn" onclick="selectPattern('side', this)">↔️ ゆらゆら</button>
      <button class="pattern-btn" onclick="selectPattern('scale', this)">🔍 ぽわん</button>
      <button class="pattern-btn" onclick="selectPattern('swing', this)">⏰ メトロノーム</button>
    </div>

    <!-- 3. 作成ボタン -->
    <button class="btn generate-btn" id="generateBtn" onclick="generateAPNG()">
      💾 2. 動くPNGを作る
    </button>

    <div id="status"></div>
  </div>

  <script>
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    const fileInput = document.getElementById('fileInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const previewContainer = document.getElementById('previewContainer');

    let img = null;
    let angle = 0;
    let currentPattern = 'updown';

    drawPlaceholder();

    function drawPlaceholder() {
      ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = '#888';
      ctx.font = '16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('画像を選択してニャ', cv.width / 2, cv.height / 2);
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const newImg = new Image();
        newImg.onload = () => {
          img = newImg;
          previewContainer.innerHTML = '';
          previewContainer.appendChild(cv);
          status.textContent = '準備OK！動きをえらんでボタンを押してニャ！';
        };
        newImg.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    function selectPattern(pattern, btn) {
      document.querySelectorAll('.pattern-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentPattern = pattern;
    }

    function drawFrameOnContext(targetCtx, currentAngle) {
      targetCtx.clearRect(0, 0, cv.width, cv.height);

      if (!img) return;

      targetCtx.save();

      const baseScale = Math.min(cv.width / img.width, (cv.height - 8) / img.height);
      const w = img.width * baseScale;
      const h = img.height * baseScale;

      if (currentPattern === 'swing') {
        // ⏰ メトロノーム（約2度の超控えめな傾きに調整）
        const rotateAngle = Math.sin(currentAngle) * (Math.PI / 90); 
        const pivotX = cv.width / 2;
        const pivotY = (cv.height + h) / 2;

        targetCtx.translate(pivotX, pivotY);
        targetCtx.rotate(rotateAngle);
        targetCtx.drawImage(img, -w / 2, -h, w, h);
      } else {
        let offsetX = 0;
        let offsetY = 0;
        let scaleFactor = 1.0;

        if (currentPattern === 'updown') {
          offsetY = Math.sin(currentAngle) * 4;
        } else if (currentPattern === 'side') {
          offsetX = Math.sin(currentAngle) * 4;
        } else if (currentPattern === 'scale') {
          scaleFactor = 1.0 + Math.sin(currentAngle) * 0.03;
        }

        const finalW = w * scaleFactor;
        const finalH = h * scaleFactor;
        const x = (cv.width - finalW) / 2 + offsetX;
        const y = (cv.height - finalH) / 2 + offsetY;

        targetCtx.drawImage(img, x, y, finalW, finalH);
      }

      targetCtx.restore();
    }

    function previewLoop() {
      angle = (angle + 0.05) % (Math.PI * 2);
      if (img && previewContainer.contains(cv)) {
        drawFrameOnContext(ctx, angle);
      }
      requestAnimationFrame(previewLoop);
    }
    requestAnimationFrame(previewLoop);

    function generateAPNG() {
      if (!img) {
        alert('先に画像をえらんでニャ！');
        return;
      }

      generateBtn.disabled = true;
      status.textContent = '動くPNGを変換中ニャ…';

      setTimeout(() => {
        const frames = [];
        const delays = [];
        const totalFrames = 20;

        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = cv.width;
        tempCanvas.height = cv.height;
        const tempCtx = tempCanvas.getContext('2d');

        for (let i = 0; i < totalFrames; i++) {
          const frameAngle = (i / totalFrames) * Math.PI * 2;
          drawFrameOnContext(tempCtx, frameAngle);

          const imgData = tempCtx.getImageData(0, 0, cv.width, cv.height);
          frames.push(imgData.data.buffer);
          delays.push(60);
        }

        const apngBuffer = UPNG.encode(frames, cv.width, cv.height, 0, delays);
        const blob = new Blob([apngBuffer], { type: 'image/png' });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = 'studio_overlay.png';
        a.click();

        const resultImg = document.createElement('img');
        resultImg.src = url;
        resultImg.className = 'result-img';
        previewContainer.innerHTML = '';
        previewContainer.appendChild(resultImg);

        status.textContent = '完成！DLされない場合は上の画像を「長押し保存」してニャ！';
        generateBtn.disabled = false;
      }, 50);
    }
  </script>
</body>
</html>
