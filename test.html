<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム美容＆カオスフィルター v11</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
    }

    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.2s ease, filter 0.2s ease;
      /* 高画質を維持するため初期値は無加工 */
    }

    video.mirror {
      transform: scaleX(-1);
    }

    /* ★カオスフィルター1: レインボー（色相回転アニメーション）★ */
    @keyframes rainbowShift {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }
    video.rainbow-filter {
      animation: rainbowShift 5s linear infinite; /* 5秒で一周 */
    }

    /* ★カオスフィルター2: ピクセルアート（ドット絵風）★ */
    /* 映像をCSSで無理やり縮小描画してピクセルを粗くする */
    video.pixel-filter {
      filter: blur(10px); /* 一旦ボカして四角いピクセルを際立たせる */
      image-rendering: pixelated; /* ピクセルのエッジをシャープにする（重要） */
      object-fit: contain; /* 縮小時に画像全体を収める */
      transform: scale(8); /* 8倍に拡大して大きなピクセルに見せる */
      transform-origin: center;
    }

    .light-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transition: background 0.25s ease;
      z-index: 2;
    }

    .ui-hint {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 11px;
      color: #eee;
      letter-spacing: 0.5px;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      backdrop-filter: blur(4px);
    }

    .ui-hint.hidden {
      opacity: 0;
      transform: translate(-50%, -10px);
    }

    .controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(18, 18, 24, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 16px 20px;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      width: 90vw;
      max-width: 420px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .controls.hidden {
      opacity: 0;
      transform: translate(-50%, 20px);
      pointer-events: none;
    }

    .section {
      width: 100%;
    }

    .label {
      font-size: 11px;
      font-weight: 600;
      color: #aaa;
      margin-bottom: 6px;
      text-align: center;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }

    button {
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: #ddd;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    button:active {
      transform: scale(0.94);
    }

    button.active {
      background: #ff4081;
      color: #fff;
      border-color: #ff4081;
      box-shadow: 0 0 12px rgba(255, 64, 129, 0.4);
    }

    button.actress-btn.active {
      background: linear-gradient(135deg, #ff4081, #ffb300);
      color: #fff;
      border-color: #ffb300;
      box-shadow: 0 0 14px rgba(255, 179, 0, 0.6);
    }

    button.fun-btn.active {
      background: #7c4dff;
      color: #fff;
      border-color: #7c4dff;
      box-shadow: 0 0 12px rgba(124, 77, 255, 0.4);
    }

    button.chaos-btn.active {
      background: linear-gradient(135deg, #7c4dff, #00e676); /* 紫から緑のカオスグラデ */
      color: #fff;
      border-color: #00e676;
      box-shadow: 0 0 14px rgba(0, 230, 118, 0.5);
    }

    button.mirror-on {
      background: rgba(0, 230, 118, 0.15);
      color: #00e676;
      border-color: rgba(0, 230, 118, 0.4);
    }

    button.close-btn {
      background: rgba(255, 255, 255, 0.05);
      color: #aaa;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 2px 0;
    }
  </style>
</head>

<body onclick="toggleUI(event)">

  <div class="ui-hint" id="uiHint">💡 画面タップでメニュー開閉</div>

  <div class="video-container">
    <video id="webcam" autoplay playsinline muted class="mirror"></video>
    <div class="light-overlay" id="lightOverlay"></div>
  </div>

  <div class="controls" id="controlsUI">
    
    <div class="section">
      <div class="label">✨ 無劣化ライティング</div>
      <div class="button-group">
        <button onclick="setFilter('off', this)" class="active">OFF</button>
        <button onclick="setFilter('ring', this)">💡 リングライト</button>
        <button onclick="setFilter('studiolight', this)">スタジオ美白</button>
        <button onclick="setFilter('actress', this)" class="actress-btn">👑 女優ライト</button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="section">
      <div class="label">🎨 演出・遊び心・カオス</div>
      <div class="button-group">
        <button onclick="setFilter('rosy', this)" class="fun-btn">🌸 血色ピンク</button>
        <button onclick="setFilter('retro', this)" class="fun-btn">🎞️ レトロ</button>
        <button onclick="setFilter('rainbow', this)" class="chaos-btn">🌈 レインボー</button>
        <button onclick="setFilter('pixel', this)" class="chaos-btn">🎮 ピクセル</button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="button-group">
      <button id="mirrorBtn" onclick="toggleMirror(event)" class="mirror-on">🪞 ミラー：ON</button>
      <button onclick="toggleCamera(event)">📷 カメラ切替</button>
      <button onclick="hideUIExplicit(event)" class="close-btn">🙈 メニューを隠す</button>
    </div>

  </div>

  <script>
    const video = document.getElementById('webcam');
    const overlay = document.getElementById('lightOverlay');
    const mirrorBtn = document.getElementById('mirrorBtn');
    const controlsUI = document.getElementById('controlsUI');
    const uiHint = document.getElementById('uiHint');
    let currentFacingMode = 'user';
    let currentStream = null;

    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      try {
        const constraints = {
          video: {
            facingMode: currentFacingMode,
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        };

        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
      } catch (err) {
        alert('カメラ起動エラー: ' + err.message);
      }
    }

    function toggleUI(e) {
      if (e.target.tagName === 'BUTTON' || e.target.closest('.controls')) {
        return;
      }
      controlsUI.classList.toggle('hidden');
      uiHint.classList.toggle('hidden');
    }

    function hideUIExplicit(e) {
      e.stopPropagation();
      controlsUI.classList.add('hidden');
      uiHint.classList.add('hidden');
    }

    function toggleMirror(e) {
      e.stopPropagation();
      video.classList.toggle('mirror');
      const isMirror = video.classList.contains('mirror');
      
      if (isMirror) {
        mirrorBtn.textContent = '🪞 ミラー：ON';
        mirrorBtn.classList.add('mirror-on');
      } else {
        mirrorBtn.textContent = '🪞 ミラー：OFF';
        mirrorBtn.classList.remove('mirror-on');
      }
    }

    function toggleCamera(e) {
      e.stopPropagation();
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera();
    }

    function setFilter(type, btnElement) {
      const allButtons = document.querySelectorAll('.button-group button');
      allButtons.forEach(b => b.classList.remove('active'));

      if (btnElement) {
        btnElement.classList.add('active');
      }

      // 初期化
      video.className = mirrorBtn.textContent.includes('ON') ? 'mirror' : ''; // mirrorクラスを維持
      video.style.filter = 'none';
      overlay.style.background = 'transparent';

      switch (type) {
        case 'off':
          break;

        case 'ring':
          overlay.style.background = 'rgba(255, 250, 240, 0.12)';
          break;

        case 'studiolight':
          overlay.style.background = 'rgba(255, 255, 255, 0.2)';
          break;

        case 'actress':
          overlay.style.background = 'radial-gradient(circle, rgba(255,255,255,0.28) 30%, rgba(255,240,245,0.15) 100%)';
          break;

        case 'rosy':
          overlay.style.background = 'rgba(255, 182, 193, 0.15)';
          break;

        case 'retro':
          video.style.filter = 'sepia(50%) brightness(1.1) contrast(1.1)'; // 少し明るくセピア
          break;

        case 'rainbow':
          // ★カオス：レインボー★
          // CSSアニメーション用クラスを追加
          video.classList.add('rainbow-filter');
          break;

        case 'pixel':
          // ★カオス：ピクセルアート★
          // CSSドット絵用クラスを追加
          video.classList.add('pixel-filter');
          break;
      }
    }

    startCamera();
  </script>
</body>
</html>
