<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム美容＆演出フィルター</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
    }

    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transition: filter 0.25s ease, transform 0.2s ease;
    }

    video.mirror {
      transform: scaleX(-1);
    }

    /* 画面上部のヒント案内 */
    .ui-hint {
      position: absolute;
      top: 16px;
      z-index: 5;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 11px;
      color: #eee;
      letter-spacing: 0.5px;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      backdrop-filter: blur(4px);
    }

    .ui-hint.hidden {
      opacity: 0;
      transform: translateY(-10px);
    }

    /* メイン操作パネル（ガラスモーフィズムデザイン） */
    .controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(18, 18, 24, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 16px 20px;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      width: 90vw;
      max-width: 420px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .controls.hidden {
      opacity: 0;
      transform: translate(-50%, 20px);
      pointer-events: none;
    }

    .section {
      width: 100%;
    }

    .label {
      font-size: 11px;
      font-weight: 600;
      color: #aaa;
      margin-bottom: 6px;
      text-align: center;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }

    button {
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: #ddd;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    button:active {
      transform: scale(0.94);
    }

    /* 通常アクティブ（ピンク） */
    button.active {
      background: #ff4081;
      color: #fff;
      border-color: #ff4081;
      box-shadow: 0 0 12px rgba(255, 64, 129, 0.4);
    }

    /* 女優ライト専用ボタン */
    button.actress-btn.active {
      background: linear-gradient(135deg, #ff4081, #ffb300);
      color: #fff;
      border-color: #ffb300;
      box-shadow: 0 0 14px rgba(255, 179, 0, 0.6);
    }

    /* 演出用アクティブ（パープル） */
    button.fun-btn.active {
      background: #7c4dff;
      color: #fff;
      border-color: #7c4dff;
      box-shadow: 0 0 12px rgba(124, 77, 255, 0.4);
    }

    /* ミラーボタン */
    button.mirror-on {
      background: rgba(0, 230, 118, 0.15);
      color: #00e676;
      border-color: rgba(0, 230, 118, 0.4);
    }

    /* 非表示ボタン */
    button.close-btn {
      background: rgba(255, 255, 255, 0.05);
      color: #aaa;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 2px 0;
    }
  </style>
</head>

<body onclick="toggleUI(event)">

  <div class="ui-hint" id="uiHint">💡 画面タップでメニュー開閉</div>

  <video id="webcam" autoplay playsinline muted class="mirror"></video>

  <div class="controls" id="controlsUI">
    
    <!-- 美肌・ライティング -->
    <div class="section">
      <div class="label">✨ 美肌・ライティング</div>
      <div class="button-group">
        <button onclick="setFilter('off', this)" class="active">OFF</button>
        <button onclick="setFilter('ring', this)">💡 リングライト</button>
        <button onclick="setFilter('studiolight', this)">スタジオ美白</button>
        <button onclick="setFilter('actress', this)" class="actress-btn">👑 女優ライト</button>
      </div>
    </div>

    <div class="divider"></div>

    <!-- 演出・ネタ -->
    <div class="section">
      <div class="label">🎨 演出・ネタ</div>
      <div class="button-group">
        <button onclick="setFilter('mono', this)" class="fun-btn">🎬 モノクロ</button>
        <button onclick="setFilter('retro', this)" class="fun-btn">🎞️ レトロ</button>
      </div>
    </div>

    <div class="divider"></div>

    <!-- システム操作 -->
    <div class="button-group">
      <button id="mirrorBtn" onclick="toggleMirror(event)" class="mirror-on">🪞 ミラー：ON</button>
      <button onclick="toggleCamera(event)">📷 カメラ切替</button>
      <button onclick="hideUIExplicit(event)" class="close-btn">🙈 メニューを隠す</button>
    </div>

  </div>

  <script>
    const video = document.getElementById('webcam');
    const mirrorBtn = document.getElementById('mirrorBtn');
    const controlsUI = document.getElementById('controlsUI');
    const uiHint = document.getElementById('uiHint');
    let currentFacingMode = 'user';
    let currentStream = null;

    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      try {
        const constraints = {
          video: {
            facingMode: currentFacingMode,
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        };

        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
      } catch (err) {
        alert('カメラ起動エラー: ' + err.message);
      }
    }

    function toggleUI(e) {
      if (e.target.tagName === 'BUTTON' || e.target.closest('.controls')) {
        return;
      }
      controlsUI.classList.toggle('hidden');
      uiHint.classList.toggle('hidden');
    }

    function hideUIExplicit(e) {
      e.stopPropagation();
      controlsUI.classList.add('hidden');
      uiHint.classList.add('hidden');
    }

    function toggleMirror(e) {
      e.stopPropagation();
      video.classList.toggle('mirror');
      const isMirror = video.classList.contains('mirror');
      
      if (isMirror) {
        mirrorBtn.textContent = '🪞 ミラー：ON';
        mirrorBtn.classList.add('mirror-on');
      } else {
        mirrorBtn.textContent = '🪞 ミラー：OFF';
        mirrorBtn.classList.remove('mirror-on');
      }
    }

    function toggleCamera(e) {
      e.stopPropagation();
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera();
    }

    function setFilter(type, btnElement) {
      const allButtons = document.querySelectorAll('.button-group button');
      allButtons.forEach(b => b.classList.remove('active'));

      if (btnElement) {
        btnElement.classList.add('active');
      }

      switch (type) {
        case 'off':
          video.style.filter = 'none';
          break;

        case 'ring':
          video.style.filter = 'brightness(1.15) contrast(0.92) saturate(1.05)';
          break;

        case 'studiolight':
          video.style.filter = 'brightness(1.28) contrast(0.88) saturate(0.98) blur(0.3px)';
          break;

        case 'actress':
          video.style.filter = 'brightness(1.5) contrast(0.78) saturate(1.05) blur(0.4px)';
          break;

        case 'mono':
          video.style.filter = 'grayscale(100%) brightness(1.1) contrast(1.35)';
          break;

        case 'retro':
          video.style.filter = 'sepia(0.65) brightness(1.08) contrast(1.15) saturate(1.3)';
          break;

        default:
          video.style.filter = 'none';
      }
    }

    startCamera();
  </script>
</body>
</html>
