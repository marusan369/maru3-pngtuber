<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム美容フィルター v4</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
    }

    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transition: filter 0.2s ease, transform 0.2s ease;
    }

    video.mirror {
      transform: scaleX(-1);
    }

    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0, 0, 0, 0.75);
      padding: 14px 18px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      max-width: 95vw;
      backdrop-filter: blur(8px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .controls.hidden {
      opacity: 0;
      transform: translate(-50%, 20px);
      pointer-events: none;
    }

    .ui-hint {
      position: absolute;
      top: 15px;
      z-index: 5;
      background: rgba(0, 0, 0, 0.5);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      color: #ddd;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .ui-hint.hidden {
      opacity: 0;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    button {
      padding: 10px 14px;
      font-size: 13px;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      background: #333;
      color: white;
      font-weight: bold;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.92);
    }

    button.active {
      background: #ff4081;
      color: white;
      box-shadow: 0 0 10px rgba(255, 64, 129, 0.5);
    }

    button.mirror-on {
      background: #00e676;
      color: #000;
    }

    .label {
      font-size: 11px;
      color: #ccc;
      margin-bottom: 4px;
      text-align: center;
    }
  </style>
</head>

<body onclick="toggleUI(event)">

  <div class="ui-hint" id="uiHint">💡 画面タップでメニュー開閉</div>

  <video id="webcam" autoplay playsinline muted class="mirror"></video>

  <div class="controls" id="controlsUI">
    
    <!-- 改修版：ライト感＆美肌に特化したボタン編成 -->
    <div>
      <div class="label">✨ 美肌＆リングライトフィルター</div>
      <div class="button-group">
        <button onclick="setFilter('off', this)" class="active">OFF</button>
        <button onclick="setFilter('ring', this)">リングライト（自然）</button>
        <button onclick="setFilter('studiolight', this)">美白スタジオライト</button>
        <button onclick="setFilter('clear', this)">透明感UP</button>
      </div>
    </div>

    <!-- 機能切り替え -->
    <div class="button-group" style="margin-top: 2px;">
      <button id="mirrorBtn" onclick="toggleMirror(event)" class="mirror-on">ミラー：ON</button>
      <button onclick="toggleCamera(event)">カメラ切替</button>
      <button onclick="hideUIExplicit(event)" style="background: #555;">画面を隠す ✕</button>
    </div>

  </div>

  <script>
    const video = document.getElementById('webcam');
    const mirrorBtn = document.getElementById('mirrorBtn');
    const controlsUI = document.getElementById('controlsUI');
    const uiHint = document.getElementById('uiHint');
    let currentFacingMode = 'user';
    let currentStream = null;

    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      try {
        const constraints = {
          video: {
            facingMode: currentFacingMode,
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        };

        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
      } catch (err) {
        alert('カメラ起動エラー: ' + err.message);
      }
    }

    function toggleUI(e) {
      if (e.target.tagName === 'BUTTON' || e.target.closest('.controls')) {
        return;
      }
      controlsUI.classList.toggle('hidden');
      uiHint.classList.toggle('hidden');
    }

    function hideUIExplicit(e) {
      e.stopPropagation();
      controlsUI.classList.add('hidden');
      uiHint.classList.add('hidden');
    }

    function toggleMirror(e) {
      e.stopPropagation();
      video.classList.toggle('mirror');
      const isMirror = video.classList.contains('mirror');
      
      if (isMirror) {
        mirrorBtn.textContent = 'ミラー：ON';
        mirrorBtn.classList.add('mirror-on');
      } else {
        mirrorBtn.textContent = 'ミラー：OFF';
        mirrorBtn.classList.remove('mirror-on');
      }
    }

    function toggleCamera(e) {
      e.stopPropagation();
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera();
    }

    // --- ライト感を意識した新パラメータ設定 ---
    function setFilter(type, btnElement) {
      if (btnElement && btnElement.parentElement) {
        const buttons = btnElement.parentElement.querySelectorAll('button');
        buttons.forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
      }

      switch (type) {
        case 'off':
          video.style.filter = 'none';
          break;

        case 'ring':
          // リングライト：ボカシなし！明るさと適度なコントラスト低下で顔の影だけ飛ばす
          video.style.filter = 'brightness(1.15) contrast(0.92) saturate(1.05)';
          break;

        case 'studiolight':
          // 美白スタジオライト：ガッツリ光を当てて白肌にする（極小の0.3pxボカシで輪郭はシャープに保持）
          video.style.filter = 'brightness(1.28) contrast(0.88) saturate(0.98) blur(0.3px)';
          break;

        case 'clear':
          // 透明感UP：少し明るくしつつ、くすみを飛ばしてくっきり透明感を出す
          video.style.filter = 'brightness(1.12) contrast(1.02) saturate(1.18) hue-rotate(-3deg)';
          break;

        default:
          video.style.filter = 'none';
      }
    }

    startCamera();
  </script>
</body>
</html>
