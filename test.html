<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム美白＆スポットライティング v19</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
    }

    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* 映像本体ではなくCanvasで描画 */
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* バックグラウンド処理用の非表示video */
    video {
      display: none;
    }

    .ui-hint {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 11px;
      color: #eee;
      letter-spacing: 0.5px;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      backdrop-filter: blur(4px);
    }

    .ui-hint.hidden {
      opacity: 0;
      transform: translate(-50%, -10px);
    }

    .controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(18, 18, 24, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 16px 20px;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      width: 90vw;
      max-width: 440px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .controls.hidden {
      opacity: 0;
      transform: translate(-50%, 20px);
      pointer-events: none;
    }

    .section {
      width: 100%;
    }

    .label {
      font-size: 11px;
      font-weight: 600;
      color: #aaa;
      margin-bottom: 6px;
      text-align: center;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }

    button {
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: #ddd;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    button:active {
      transform: scale(0.94);
    }

    button.active {
      background: #ff4081;
      color: #fff;
      border-color: #ff4081;
      box-shadow: 0 0 12px rgba(255, 64, 129, 0.4);
    }

    button.fun-btn.active {
      background: #7c4dff;
      color: #fff;
      border-color: #7c4dff;
      box-shadow: 0 0 12px rgba(124, 77, 255, 0.4);
    }

    button.party-btn.active {
      background: linear-gradient(135deg, #ff007f, #7c4dff, #00e676);
      color: #fff;
      border-color: #ff007f;
      box-shadow: 0 0 16px rgba(255, 0, 127, 0.7);
    }

    button.mirror-on {
      background: rgba(0, 230, 118, 0.15);
      color: #00e676;
      border-color: rgba(0, 230, 118, 0.4);
    }

    button.close-btn {
      background: rgba(255, 255, 255, 0.05);
      color: #aaa;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 2px 0;
    }
  </style>
</head>

<body onclick="toggleUI(event)">

  <div class="ui-hint" id="uiHint">💡 画面タップでメニュー開閉</div>

  <div class="video-container">
    <!-- 内部ビデオ処理用（非表示） -->
    <video id="webcam" autoplay playsinline muted></video>
    <!-- メイン描画用Canvas -->
    <canvas id="outputCanvas"></canvas>
  </div>

  <div class="controls" id="controlsUI">
    
    <div class="section">
      <div class="label">💡 ライティングプリセット</div>
      <div class="button-group">
        <button onclick="setLighting('off', this)" class="active">OFF</button>
        <button onclick="setLighting('natural', this)">🌿 自然光</button>
        <button onclick="setLighting('ring', this)">⭕ リングライト</button>
        <button onclick="setLighting('actress', this)">✨ 女優ライト</button>
        <button onclick="setLighting('actressMax', this)">👑 女優ライトMAX</button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="section">
      <div class="label">🎨 演出</div>
      <div class="button-group">
        <button onclick="setLighting('rosy', this)" class="fun-btn">🌸 血色ピンク</button>
        <button onclick="setLighting('party', this)" class="party-btn">🎉 パリピレインボー</button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="button-group">
      <button id="mirrorBtn" onclick="toggleMirror(event)" class="mirror-on">🪞 ミラー：ON</button>
      <button onclick="toggleCamera(event)">📷 カメラ切替</button>
      <button onclick="hideUIExplicit(event)" class="close-btn">🙈 メニューを隠す</button>
    </div>

  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const mirrorBtn = document.getElementById('mirrorBtn');
    const controlsUI = document.getElementById('controlsUI');
    const uiHint = document.getElementById('uiHint');

    let currentFacingMode = 'user';
    let currentStream = null;
    let isMirror = true;
    let currentMode = 'off';
    let rainbowHue = 0;

    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      try {
        const constraints = {
          video: {
            facingMode: currentFacingMode,
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        };

        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        video.play();
      } catch (err) {
        alert('カメラ起動エラー: ' + err.message);
      }
    }

    // Canvasへのリアルタイム描画ループ
    function renderFrame() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        // 解像度の同期
        if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        }

        ctx.save();
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // ミラー処理
        if (isMirror) {
          ctx.translate(canvas.width, 0);
          ctx.scale(-1, 1);
        }

        // ベースのCSSフィルター設定
        applyBaseFilter();

        // ビデオを描画
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // フィルターのリセット（オーバーレイ用）
        ctx.filter = 'none';

        // スポットライティング（中央を明るく照らす擬似スポット）
        applySpotlightOverlay();

        ctx.restore();
      }

      requestAnimationFrame(renderFrame);
    }

    // モードに応じた画像調整（CSS filter風の描画演算）
    function applyBaseFilter() {
      switch (currentMode) {
        case 'natural':
          ctx.filter = 'brightness(1.08) contrast(1.02) saturate(1.04)';
          break;
        case 'ring':
          ctx.filter = 'brightness(1.15) contrast(1.06) saturate(1.06)';
          break;
        case 'actress':
          ctx.filter = 'brightness(1.22) contrast(1.10) saturate(1.08)';
          break;
        case 'actressMax':
          ctx.filter = 'brightness(1.32) contrast(1.14) saturate(1.10)';
          break;
        case 'rosy':
          ctx.filter = 'brightness(1.12) contrast(1.03) saturate(1.30)';
          break;
        case 'party':
          rainbowHue = (rainbowHue + 4) % 360;
          ctx.filter = `hue-rotate(${rainbowHue}deg) saturate(1.5) brightness(1.1)`;
          break;
        default:
          ctx.filter = 'none';
          break;
      }
    }

    // スポットライティング（顔周辺を中心に柔らかく照らす）
    function applySpotlightOverlay() {
      const w = canvas.width;
      const h = canvas.height;
      const centerX = w / 2;
      const centerY = h * 0.42; // 顔が来やすい少し高めの位置

      if (currentMode === 'ring' || currentMode === 'actress' || currentMode === 'actressMax') {
        const radius = Math.max(w, h) * 0.6;
        const gradient = ctx.createRadialGradient(centerX, centerY, 50, centerX, centerY, radius);

        if (currentMode === 'ring') {
          // リングライト：顔の周りを中心にほんのり暖色ライト
          gradient.addColorStop(0, 'rgba(255, 252, 245, 0.18)');
          gradient.addColorStop(0.6, 'rgba(255, 245, 235, 0.08)');
          gradient.addColorStop(1, 'rgba(0, 0, 0, 0.15)');
        } else if (currentMode === 'actress') {
          // 女優ライト：透明感のある明るいスポット
          gradient.addColorStop(0, 'rgba(255, 255, 255, 0.25)');
          gradient.addColorStop(0.5, 'rgba(255, 248, 240, 0.12)');
          gradient.addColorStop(1, 'rgba(0, 0, 0, 0.22)');
        } else if (currentMode === 'actressMax') {
          // 女優ライトMAX：強力な中央集中スポット＆外側シャドウ
          gradient.addColorStop(0, 'rgba(255, 255, 255, 0.35)');
          gradient.addColorStop(0.4, 'rgba(255, 245, 245, 0.18)');
          gradient.addColorStop(1, 'rgba(0, 0, 0, 0.30)');
        }

        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, w, h);
      } else if (currentMode === 'rosy') {
        const radius = Math.max(w, h) * 0.6;
        const gradient = ctx.createRadialGradient(centerX, centerY, 50, centerX, centerY, radius);
        gradient.addColorStop(0, 'rgba(255, 210, 220, 0.20)');
        gradient.addColorStop(1, 'rgba(255, 180, 200, 0.05)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, w, h);
      }
    }

    function toggleUI(e) {
      if (e.target.tagName === 'BUTTON' || e.target.closest('.controls')) {
        return;
      }
      controlsUI.classList.toggle('hidden');
      uiHint.classList.toggle('hidden');
    }

    function hideUIExplicit(e) {
      e.stopPropagation();
      controlsUI.classList.add('hidden');
      uiHint.classList.add('hidden');
    }

    function toggleMirror(e) {
      e.stopPropagation();
      isMirror = !isMirror;
      if (isMirror) {
        mirrorBtn.textContent = '🪞 ミラー：ON';
        mirrorBtn.classList.add('mirror-on');
      } else {
        mirrorBtn.textContent = '🪞 ミラー：OFF';
        mirrorBtn.classList.remove('mirror-on');
      }
    }

    function toggleCamera(e) {
      e.stopPropagation();
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera();
    }

    function setLighting(mode, btnElement) {
      const allButtons = document.querySelectorAll('.button-group button');
      allButtons.forEach(b => b.classList.remove('active'));

      if (btnElement) {
        btnElement.classList.add('active');
      }

      currentMode = mode;
    }

    startCamera();
    requestAnimationFrame(renderFrame);
  </script>
</body>
</html>
