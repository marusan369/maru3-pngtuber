<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム美容フィルター v3</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
    }

    /* カメラ映像を画面いっぱいに表示 */
    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transition: filter 0.2s ease, transform 0.2s ease;
    }

    /* ミラー（左右反転） */
    video.mirror {
      transform: scaleX(-1);
    }

    /* 配信画面の上に重ねる操作パネル */
    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0, 0, 0, 0.75);
      padding: 14px 18px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      max-width: 95vw;
      backdrop-filter: blur(8px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    /* メニュー非表示時のスタイル */
    .controls.hidden {
      opacity: 0;
      transform: translate(-50%, 20px);
      pointer-events: none; /* タップを通過させる */
    }

    /* 画面タップでUIを表示させるためのヒント案内 */
    .ui-hint {
      position: absolute;
      top: 15px;
      z-index: 5;
      background: rgba(0, 0, 0, 0.5);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      color: #ddd;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .ui-hint.hidden {
      opacity: 0;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    button {
      padding: 10px 14px;
      font-size: 13px;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      background: #333;
      color: white;
      font-weight: bold;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.92);
    }

    /* 選択中のプリセットボタン */
    button.active {
      background: #ff4081;
      color: white;
      box-shadow: 0 0 10px rgba(255, 64, 129, 0.5);
    }

    /* ミラーボタンのON状態 */
    button.mirror-on {
      background: #00e676;
      color: #000;
    }

    .label {
      font-size: 11px;
      color: #ccc;
      margin-bottom: 4px;
      text-align: center;
    }
  </style>
</head>

<!-- 画面全体をタップしてメニュー表示・非表示を切り替え -->
<body onclick="toggleUI(event)">

  <div class="ui-hint" id="uiHint">💡 画面をタップでメニュー開閉</div>

  <!-- カメラ映像本体 -->
  <video id="webcam" autoplay playsinline muted class="mirror"></video>

  <!-- 操作用UI -->
  <div class="controls" id="controlsUI">
    
    <!-- 美容フィルター切り替え（ガッツリ効くように調整！） -->
    <div>
      <div class="label">✨ 美容フィルター（強め調整版）</div>
      <div class="button-group">
        <button onclick="setFilter('off', this)" class="active">OFF</button>
        <button onclick="setFilter('natural', this)">ナチュラル美肌</button>
        <button onclick="setFilter('soft', this)">爆盛り美白</button>
        <button onclick="setFilter('rosy', this)">血色ピンク</button>

        <button onclick="setFilter('retro', this)">エモレトロ</button>
      </div>
    </div>

    <!-- 機能切り替え -->
    <div class="button-group" style="margin-top: 2px;">
      <button id="mirrorBtn" onclick="toggleMirror(event)" class="mirror-on">ミラー：ON</button>
      <button onclick="toggleCamera(event)">カメラ切替</button>
      <button onclick="hideUIExplicit(event)" style="background: #555;">画面を隠す ✕</button>
    </div>

  </div>

  <script>
    const video = document.getElementById('webcam');
    const mirrorBtn = document.getElementById('mirrorBtn');
    const controlsUI = document.getElementById('controlsUI');
    const uiHint = document.getElementById('uiHint');
    let currentFacingMode = 'user';
    let currentStream = null;

    // --- カメラ起動処理 ---
    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      try {
        const constraints = {
          video: {
            facingMode: currentFacingMode,
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        };

        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
      } catch (err) {
        alert('カメラ起動エラー: ' + err.message);
      }
    }

    // --- メニュー表示・非表示のトグル（画面どこでもタップ） ---
    function toggleUI(e) {
      // ボタン自体を押し込んだ時はメニューを閉じないようにする
      if (e.target.tagName === 'BUTTON' || e.target.closest('.controls')) {
        return;
      }
      controlsUI.classList.toggle('hidden');
      uiHint.classList.toggle('hidden');
    }

    // ボタンから直接メニューを隠す
    function hideUIExplicit(e) {
      e.stopPropagation();
      controlsUI.classList.add('hidden');
      uiHint.classList.add('hidden');
    }

    // --- ミラー（左右反転）切り替え ---
    function toggleMirror(e) {
      e.stopPropagation();
      video.classList.toggle('mirror');
      const isMirror = video.classList.contains('mirror');
      
      if (isMirror) {
        mirrorBtn.textContent = 'ミラー：ON';
        mirrorBtn.classList.add('mirror-on');
      } else {
        mirrorBtn.textContent = 'ミラー：OFF';
        mirrorBtn.classList.remove('mirror-on');
      }
    }

    // --- イン/アウトカメラ切り替え ---
    function toggleCamera(e) {
      e.stopPropagation();
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera();
    }

    // --- ガッツリ効く！美容フィルター設定 ---
    function setFilter(type, btnElement) {
      if (btnElement && btnElement.parentElement) {
        const buttons = btnElement.parentElement.querySelectorAll('button');
        buttons.forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
      }

      switch (type) {
        case 'off':
          // ノーマル（加工なし）
          video.style.filter = 'none';
          break;

        case 'natural':
          // ナチュラル美肌：しっかりトーンアップ＆程よい美肌ボカシ
          video.style.filter = 'brightness(1.2) contrast(0.92) saturate(1.1) blur(1px)';
          break;

        case 'soft':
          // 爆盛り美白：ガッツリ美白＆ふわふわライト（すっぴん隠しレベル）
          video.style.filter = 'brightness(1.35) contrast(0.85) saturate(0.9) blur(1.8px)';
          break;

        case 'rosy':
          // 血色ピンク：チーク・リップが映える強力な赤み・血色補正
          video.style.filter = 'brightness(1.15) contrast(1.05) saturate(1.6) hue-rotate(-10deg) blur(0.8px)';
          break;

        case 'retro':
          // エモレトロ：しっかり雰囲気が変わるシネマティック加工
          video.style.filter = 'brightness(1.1) contrast(1.2) sepia(0.4) saturate(1.3)';
          break;

        default:
          video.style.filter = 'none';
      }
    }

    // 初期起動
    startCamera();
  </script>
</body>
</html>
