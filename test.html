<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム美白＆演出フィルター v18（インパクト重視版）</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
    }

    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    video.mirror {
      transform: scaleX(-1);
    }

    /* パリピレインボー */
    @keyframes partyRainbow {
      0% { filter: hue-rotate(0deg) saturate(1.6); }
      100% { filter: hue-rotate(360deg) saturate(1.6); }
    }
    video.party-rainbow {
      animation: partyRainbow 0.8s linear infinite;
    }

    .ui-hint {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 11px;
      color: #eee;
      letter-spacing: 0.5px;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      backdrop-filter: blur(4px);
    }

    .ui-hint.hidden {
      opacity: 0;
      transform: translate(-50%, -10px);
    }

    .controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(18, 18, 24, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 16px 20px;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      width: 90vw;
      max-width: 420px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .controls.hidden {
      opacity: 0;
      transform: translate(-50%, 20px);
      pointer-events: none;
    }

    .section {
      width: 100%;
    }

    .label {
      font-size: 11px;
      font-weight: 600;
      color: #aaa;
      margin-bottom: 6px;
      text-align: center;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }

    button {
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: #ddd;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    button:active {
      transform: scale(0.94);
    }

    button.active {
      background: #ff4081;
      color: #fff;
      border-color: #ff4081;
      box-shadow: 0 0 12px rgba(255, 64, 129, 0.4);
    }

    button.fun-btn.active {
      background: #7c4dff;
      color: #fff;
      border-color: #7c4dff;
      box-shadow: 0 0 12px rgba(124, 77, 255, 0.4);
    }

    button.party-btn.active {
      background: linear-gradient(135deg, #ff007f, #7c4dff, #00e676);
      color: #fff;
      border-color: #ff007f;
      box-shadow: 0 0 16px rgba(255, 0, 127, 0.7);
    }

    button.mirror-on {
      background: rgba(0, 230, 118, 0.15);
      color: #00e676;
      border-color: rgba(0, 230, 118, 0.4);
    }

    button.close-btn {
      background: rgba(255, 255, 255, 0.05);
      color: #aaa;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 2px 0;
    }
  </style>
</head>

<body onclick="toggleUI(event)">

  <div class="ui-hint" id="uiHint">💡 画面タップでメニュー開閉</div>

  <div class="video-container">
    <video id="webcam" autoplay playsinline muted class="mirror"></video>
  </div>

  <div class="controls" id="controlsUI">
    
    <div class="section">
      <div class="label">✨ 美肌トーン補正</div>
      <div class="button-group">
        <button onclick="setFilter('off', this)" class="active">OFF</button>
        <button onclick="setFilter('lvl1', this)">美白 Lv.1</button>
        <button onclick="setFilter('lvl2', this)">美白 Lv.2</button>
        <button onclick="setFilter('lvl3', this)">美白 Lv.3</button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="section">
      <div class="label">🎨 演出</div>
      <div class="button-group">
        <button onclick="setFilter('rosy', this)" class="fun-btn">🌸 血色ピンク</button>
        <button onclick="setFilter('retro', this)" class="fun-btn">🎞️ レトロ</button>
        <button onclick="setFilter('party', this)" class="party-btn">🎉 パリピレインボー</button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="button-group">
      <button id="mirrorBtn" onclick="toggleMirror(event)" class="mirror-on">🪞 ミラー：ON</button>
      <button onclick="toggleCamera(event)">📷 カメラ切替</button>
      <button onclick="hideUIExplicit(event)" class="close-btn">🙈 メニューを隠す</button>
    </div>

  </div>

  <script>
    const video = document.getElementById('webcam');
    const mirrorBtn = document.getElementById('mirrorBtn');
    const controlsUI = document.getElementById('controlsUI');
    const uiHint = document.getElementById('uiHint');
    let currentFacingMode = 'user';
    let currentStream = null;

    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      try {
        const constraints = {
          video: {
            facingMode: currentFacingMode,
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        };

        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
      } catch (err) {
        alert('カメラ起動エラー: ' + err.message);
      }
    }

    function toggleUI(e) {
      if (e.target.tagName === 'BUTTON' || e.target.closest('.controls')) {
        return;
      }
      controlsUI.classList.toggle('hidden');
      uiHint.classList.toggle('hidden');
    }

    function hideUIExplicit(e) {
      e.stopPropagation();
      controlsUI.classList.add('hidden');
      uiHint.classList.add('hidden');
    }

    function toggleMirror(e) {
      e.stopPropagation();
      video.classList.toggle('mirror');
      const isMirror = video.classList.contains('mirror');
      
      if (isMirror) {
        mirrorBtn.textContent = '🪞 ミラー：ON';
        mirrorBtn.classList.add('mirror-on');
      } else {
        mirrorBtn.textContent = '🪞 ミラー：OFF';
        mirrorBtn.classList.remove('mirror-on');
      }
    }

    function toggleCamera(e) {
      e.stopPropagation();
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera();
    }

    function setFilter(type, btnElement) {
      const allButtons = document.querySelectorAll('.button-group button');
      allButtons.forEach(b => b.classList.remove('active'));

      if (btnElement) {
        btnElement.classList.add('active');
      }

      // 初期化
      video.className = mirrorBtn.textContent.includes('ON') ? 'mirror' : '';

      /* 
        ★メリハリとインパクトを重視した値に再設定★
        - Lv.1: 自然にくすみを消す
        - Lv.2: はっきり明るく・白く見せる
        - Lv.3: ドカンとトーンアップ（強力なインパクト）
      */
      switch (type) {
        case 'off':
          video.style.filter = 'none';
          break;

        case 'lvl1':
          // Lv.1：ほんのり明度UP（+12%）
          video.style.filter = 'brightness(1.12) contrast(1.04) saturate(1.05)';
          break;

        case 'lvl2':
          // Lv.2：はっきり美白（+28%）。明るさとコントラストを同時に伸ばす
          video.style.filter = 'brightness(1.28) contrast(1.12) saturate(1.10)';
          break;

        case 'lvl3':
          // Lv.3：強烈な透明感（+45%）。一目で「白っ！」とわかるインパクト
          video.style.filter = 'brightness(1.45) contrast(1.18) saturate(1.12)';
          break;

        case 'rosy':
          video.style.filter = 'brightness(1.18) contrast(1.05) saturate(1.35) sepia(12%)';
          break;

        case 'retro':
          video.style.filter = 'sepia(50%) brightness(1.1) contrast(1.1)';
          break;

        case 'party':
          video.classList.add('party-rainbow');
          break;
      }
    }

    startCamera();
  </script>
</body>
</html>
