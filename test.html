<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ツイキャス用 簡易アニメPNGメーカー v2</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: #121216;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 16px;
      margin: 0 0 16px 0;
      color: #ff4081;
    }

    .preview-box {
      width: 300px;
      height: 300px;
      border-radius: 12px;
      border: 2px dashed rgba(255, 255, 255, 0.2);
      background-color: #1a1a20;
      background-image: 
        linear-gradient(45deg, #222 25%, transparent 25%), 
        linear-gradient(-45deg, #222 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #222 75%), 
        linear-gradient(-45deg, transparent 75%, #222 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      overflow: hidden;
    }

    canvas, img.result-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .controls {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label.field-label {
      font-size: 12px;
      color: #aaa;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #222;
      color: #fff;
      font-size: 14px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      text-align: center;
    }

    .file-label {
      background: #3f51b5;
      color: #fff;
    }

    input[type="file"] {
      display: none;
    }

    .generate-btn {
      background: #00e676;
      color: #000;
    }

    .generate-btn:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }

    #status {
      font-size: 12px;
      color: #ffb74d;
      text-align: center;
      min-height: 18px;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/upng-js@2.1.0/UPNG.js"></script>
</head>
<body>

  <h1>🎬 アニメPNGメーカー v2</h1>

  <div class="preview-box" id="previewContainer">
    <canvas id="cv" width="400" height="400"></canvas>
  </div>

  <div class="controls">
    <!-- 1. 画像選択 -->
    <label class="btn file-label">
      📁 1. 画像をえらぶ
      <input type="file" id="fileInput" accept="image/*">
    </label>

    <!-- 2. ファイル名指定 -->
    <div class="input-group">
      <label class="field-label">保存ファイル名（.pngは自動で付きます）</label>
      <input type="text" id="fileNameInput" value="studio_overlay">
    </div>

    <!-- 3. 作成ボタン -->
    <button class="btn generate-btn" id="generateBtn" onclick="generateAPNG()">
      💾 3. 動くPNGを作る
    </button>

    <div id="status"></div>
  </div>

  <script>
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    const fileInput = document.getElementById('fileInput');
    const fileNameInput = document.getElementById('fileNameInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const previewContainer = document.getElementById('previewContainer');

    let img = null;
    let angle = 0;

    drawPlaceholder();

    function drawPlaceholder() {
      ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = '#888';
      ctx.font = '16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('画像を選択してニャ', cv.width / 2, cv.height / 2);
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const newImg = new Image();
        newImg.onload = () => {
          img = newImg;
          // Canvas表示を復元
          previewContainer.innerHTML = '';
          previewContainer.appendChild(cv);
          status.textContent = '準備OK！ファイル名をきめてボタンを押してニャ！';
        };
        newImg.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    function drawFrameOnContext(targetCtx, currentAngle) {
      targetCtx.clearRect(0, 0, cv.width, cv.height);

      if (!img) return;

      targetCtx.save();
      // 💡【修正点1】揺れ幅を小刻み＆控えめに（12px → 4pxへ変更）
      const offsetY = Math.sin(currentAngle) * 4;

      // 💡【修正点2】余白を小さくして、画像の描画サイズを大きく（余白ほぼ無し）
      const scale = Math.min(cv.width / img.width, (cv.height - 8) / img.height);
      const w = img.width * scale;
      const h = img.height * scale;
      const x = (cv.width - w) / 2;
      const y = (cv.height - h) / 2 + offsetY;

      targetCtx.drawImage(img, x, y, w, h);
      targetCtx.restore();
    }

    function previewLoop() {
      angle = (angle + 0.05) % (Math.PI * 2);
      if (img && previewContainer.contains(cv)) {
        drawFrameOnContext(ctx, angle);
      }
      requestAnimationFrame(previewLoop);
    }
    requestAnimationFrame(previewLoop);

    function generateAPNG() {
      if (!img) {
        alert('先に画像をえらんでニャ！');
        return;
      }

      generateBtn.disabled = true;
      status.textContent = '動くPNGを変換中ニャ…';

      setTimeout(() => {
        const frames = [];
        const delays = [];
        const totalFrames = 20;

        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = cv.width;
        tempCanvas.height = cv.height;
        const tempCtx = tempCanvas.getContext('2d');

        for (let i = 0; i < totalFrames; i++) {
          const frameAngle = (i / totalFrames) * Math.PI * 2;
          drawFrameOnContext(tempCtx, frameAngle);

          const imgData = tempCtx.getImageData(0, 0, cv.width, cv.height);
          frames.push(imgData.data.buffer);
          delays.push(60);
        }

        const apngBuffer = UPNG.encode(frames, cv.width, cv.height, 0, delays);
        const blob = new Blob([apngBuffer], { type: 'image/png' });
        const url = URL.createObjectURL(blob);

        // 💡【修正点3】ファイル名指定＋スマホで長押し保存もできるようにプレビュー差し替え
        let name = fileNameInput.value.trim() || 'studio_overlay';
        if (!name.endsWith('.png')) name += '.png';

        const a = document.createElement('a');
        a.href = url;
        a.download = name;
        a.click();

        // スマホで「画像を長押しして保存」もできるように、プレビュー枠に生成画像を置く
        const resultImg = document.createElement('img');
        resultImg.src = url;
        resultImg.className = 'result-img';
        previewContainer.innerHTML = '';
        previewContainer.appendChild(resultImg);

        status.textContent = '完成！DLされない場合は上の画像を「長押し保存」してニャ！';
        generateBtn.disabled = false;
      }, 50);
    }
  </script>
</body>
</html>
