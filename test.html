<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>簡易アニメーションWebPメーカー</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: #121216;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 16px;
      margin: 0 0 16px 0;
      color: #ff4081;
    }

    /* プレビュー表示エリア（背景格子模様） */
    .preview-box {
      width: 260px;
      height: 260px;
      border-radius: 12px;
      border: 2px dashed rgba(255, 255, 255, 0.2);
      background-color: #1a1a20;
      background-image: 
        linear-gradient(45deg, #222 25%, transparent 25%), 
        linear-gradient(-45deg, #222 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #222 75%), 
        linear-gradient(-45deg, transparent 75%, #222 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      overflow: hidden;
    }

    canvas {
      max-width: 100%;
      max-height: 100%;
    }

    .controls {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ボタンデザイン */
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      text-align: center;
    }

    .file-label {
      background: #3f51b5;
      color: #fff;
    }

    input[type="file"] {
      display: none;
    }

    .generate-btn {
      background: #00e676;
      color: #000;
    }

    .generate-btn:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }

    #status {
      font-size: 12px;
      color: #ffb74d;
      text-align: center;
      min-height: 18px;
    }
  </style>
</head>
<body>

  <h1>🎬 簡易アニメーションWebPメーカー</h1>

  <div class="preview-box">
    <canvas id="cv" width="300" height="300"></canvas>
  </div>

  <div class="controls">
    <!-- 1. 画像選択 -->
    <label class="btn file-label">
      📁 1. 画像をえらぶ
      <input type="file" id="fileInput" accept="image/*">
    </label>

    <!-- 2. 出力ボタン -->
    <button class="btn generate-btn" id="generateBtn" onclick="generateWebP()">
      💾 2. アニメWebPを作る
    </button>

    <div id="status"></div>
  </div>

  <script>
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    const fileInput = document.getElementById('fileInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');

    let img = null;
    let angle = 0;

    // 初期状態の表示
    drawPlaceholder();

    function drawPlaceholder() {
      ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = '#888';
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('画像を選択してニャ', cv.width / 2, cv.height / 2);
    }

    // 画像の読み込み処理
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const newImg = new Image();
        newImg.onload = () => {
          img = newImg;
          status.textContent = '準備OK！作成ボタンを押してニャ！';
        };
        newImg.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    // 動きを描画する関数（パターン1種類：ぷかぷか上下揺れ）
    function drawFrame(currentAngle) {
      ctx.clearRect(0, 0, cv.width, cv.height);

      if (!img) {
        drawPlaceholder();
        return;
      }

      ctx.save();
      // 上下に12px揺れる計算
      const offsetY = Math.sin(currentAngle) * 12;

      // 画像を中央に配置
      const scale = Math.min((cv.width - 40) / img.width, (cv.height - 40) / img.height);
      const w = img.width * scale;
      const h = img.height * scale;
      const x = (cv.width - w) / 2;
      const y = (cv.height - h) / 2 + offsetY;

      ctx.drawImage(img, x, y, w, h);
      ctx.restore();
    }

    // 画面プレビュー用の無限ループ
    function previewLoop() {
      angle = (angle + 0.06) % (Math.PI * 2);
      drawFrame(angle);
      requestAnimationFrame(previewLoop);
    }
    requestAnimationFrame(previewLoop);

    // アニメーションWebP生成＆ダウンロード処理
    function generateWebP() {
      if (!img) {
        alert('先に画像をえらんでニャ！');
        return;
      }

      generateBtn.disabled = true;
      status.textContent = 'WebPアニメを生成中ニャ…';

      // Canvasからストリーム（映像線）を取得
      const stream = cv.captureStream(30); // 30fps
      
      // WebP（またはWebM）でエンコード準備
      let options = { mimeType: 'image/webp' };
      if (!MediaRecorder.isTypeSupported('image/webp')) {
        options = { mimeType: 'video/webm' }; // 非対応ブラウザ用フォールバック
      }

      let recorder;
      try {
        recorder = new MediaRecorder(stream, options);
      } catch (e) {
        // さらに互換性のためのフォールバック
        recorder = new MediaRecorder(stream);
      }

      const chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data);

      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'image/webp' });
        const url = URL.createObjectURL(blob);

        // 自動ダウンロード
        const a = document.createElement('a');
        a.href = url;
        a.download = 'animated_overlay.webp';
        a.click();

        status.textContent = '完成！ダウンロードされたニャ！';
        generateBtn.disabled = false;
      };

      // 1サイクル（約2秒間）分を録画して保存
      recorder.start();
      setTimeout(() => {
        recorder.stop();
      }, 2000);
    }
  </script>
</body>
</html>
