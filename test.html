<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ツイキャス用 簡易アニメPNGメーカー</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: #121216;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 16px;
      margin: 0 0 16px 0;
      color: #ff4081;
    }

    .preview-box {
      width: 260px;
      height: 260px;
      border-radius: 12px;
      border: 2px dashed rgba(255, 255, 255, 0.2);
      background-color: #1a1a20;
      background-image: 
        linear-gradient(45deg, #222 25%, transparent 25%), 
        linear-gradient(-45deg, #222 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #222 75%), 
        linear-gradient(-45deg, transparent 75%, #222 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      overflow: hidden;
    }

    canvas {
      max-width: 100%;
      max-height: 100%;
    }

    .controls {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      text-align: center;
    }

    .file-label {
      background: #3f51b5;
      color: #fff;
    }

    input[type="file"] {
      display: none;
    }

    .generate-btn {
      background: #00e676;
      color: #000;
    }

    .generate-btn:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }

    #status {
      font-size: 12px;
      color: #ffb74d;
      text-align: center;
      min-height: 18px;
    }
  </style>

  <!-- 正しいAPNG構造を生成する軽量ライブラリ UPNG.js -->
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/upng-js@2.1.0/UPNG.js"></script>
</head>
<body>

  <h1>🎬 ツイキャス用 簡易アニメPNGメーカー</h1>

  <div class="preview-box">
    <canvas id="cv" width="300" height="300"></canvas>
  </div>

  <div class="controls">
    <label class="btn file-label">
      📁 1. 画像をえらぶ
      <input type="file" id="fileInput" accept="image/*">
    </label>

    <button class="btn generate-btn" id="generateBtn" onclick="generateAPNG()">
      💾 2. 動くPNGを作る
    </button>

    <div id="status"></div>
  </div>

  <script>
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    const fileInput = document.getElementById('fileInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');

    let img = null;
    let angle = 0;

    drawPlaceholder();

    function drawPlaceholder() {
      ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = '#888';
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('画像を選択してニャ', cv.width / 2, cv.height / 2);
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const newImg = new Image();
        newImg.onload = () => {
          img = newImg;
          status.textContent = '準備OK！作成ボタンを押してニャ！';
        };
        newImg.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    function drawFrameOnContext(targetCtx, currentAngle) {
      targetCtx.clearRect(0, 0, cv.width, cv.height);

      if (!img) return;

      targetCtx.save();
      const offsetY = Math.sin(currentAngle) * 12; // ぷかぷか上下揺れ

      const scale = Math.min((cv.width - 40) / img.width, (cv.height - 40) / img.height);
      const w = img.width * scale;
      const h = img.height * scale;
      const x = (cv.width - w) / 2;
      const y = (cv.height - h) / 2 + offsetY;

      targetCtx.drawImage(img, x, y, w, h);
      targetCtx.restore();
    }

    function previewLoop() {
      angle = (angle + 0.06) % (Math.PI * 2);
      if (img) {
        drawFrameOnContext(ctx, angle);
      } else {
        drawPlaceholder();
      }
      requestAnimationFrame(previewLoop);
    }
    requestAnimationFrame(previewLoop);

    // 本物の APNG (.png) 画像ファイルを生成する処理
    function generateAPNG() {
      if (!img) {
        alert('先に画像をえらんでニャ！');
        return;
      }

      generateBtn.disabled = true;
      status.textContent = 'コマ画像を変換中ニャ…';

      setTimeout(() => {
        const frames = [];
        const delays = [];
        const totalFrames = 15; // 15コマでループ

        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = cv.width;
        tempCanvas.height = cv.height;
        const tempCtx = tempCanvas.getContext('2d');

        for (let i = 0; i < totalFrames; i++) {
          const frameAngle = (i / totalFrames) * Math.PI * 2;
          drawFrameOnContext(tempCtx, frameAngle);

          // RGBAのピクセル配列を取得
          const imgData = tempCtx.getImageData(0, 0, cv.width, cv.height);
          frames.push(imgData.data.buffer);
          delays.push(66); // 各コマ約66ms（約15fps）
        }

        // UPNGライブラリでAPNGバイナリを生成
        const apngBuffer = UPNG.encode(frames, cv.width, cv.height, 0, delays);
        const blob = new Blob([apngBuffer], { type: 'image/png' });
        const url = URL.createObjectURL(blob);

        // 最初から .png の名前で出力（ツイキャス対応）
        const a = document.createElement('a');
        a.href = url;
        a.download = 'animated_overlay.png';
        a.click();

        status.textContent = '完成！動くPNG (.png) が保存されたニャ！';
        generateBtn.disabled = false;
      }, 50);
    }
  </script>
</body>
</html>
