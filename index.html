<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PNGTuber Mobile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #222;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .avatar-img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }
        .avatar-img.active {
            display: block;
        }
        /* 操作パネルを画面下部にスッキリ配置 */
        #control-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            padding: 10px 15px;
            border-radius: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            z-index: 10;
            max-width: 95vw;
        }
        button, label {
            color: #fff;
            background: #ff69b4;
            padding: 8px 12px;
            border: none;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            font-family: sans-serif;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            text-align: center;
        }
        button:active, label:active {
            background: #ff1493;
        }
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div id="stage">
        <!-- アバター用画像 (最大3枚) -->
        <img id="avatar-normal" class="avatar-img" alt="Normal">
        <img id="avatar-talking" class="avatar-img" alt="Talking">
        <img id="avatar-extra" class="avatar-img" alt="Extra">

        <!-- 操作パネル（個別選択式） -->
        <div id="control-panel">
            <label>通常絵 <input type="file" id="loader-normal" accept="image/*"></label>
            <label>喋り絵 <input type="file" id="loader-talking" accept="image/*"></label>
            <button id="mic-btn">マイク開始</button>
            <button id="reset-btn">リセット</button>
        </div>
    </div>

    <script>
        const avatarNormal = document.getElementById('avatar-normal');
        const avatarTalking = document.getElementById('avatar-talking');
        const avatarExtra = document.getElementById('avatar-extra');
        
        const loaderNormal = document.getElementById('loader-normal');
        const loaderTalking = document.getElementById('loader-talking');
        
        const micBtn = document.getElementById('mic-btn');
        const resetBtn = document.getElementById('reset-btn');

        let imageNormalSrc = '';
        let imageTalkingSrc = '';
        
        let audioContext, analyser, microphone, dataArray;
        let isMicActive = false;
        let animationId;

        // 通常画像の読み込み
        loaderNormal.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                imageNormalSrc = event.target.result;
                avatarNormal.src = imageNormalSrc;
                avatarNormal.classList.add('active');
            };
            reader.readAsDataURL(file);
        });

        // お話し中画像の読み込み
        loaderTalking.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                imageTalkingSrc = event.target.result;
                avatarTalking.src = imageTalkingSrc;
            };
            reader.readAsDataURL(file);
        });

        // リセットボタンの処理
        resetBtn.addEventListener('click', () => {
            imageNormalSrc = '';
            imageTalkingSrc = '';
            loaderNormal.value = '';
            loaderTalking.value = '';
            
            avatarNormal.src = '';
            avatarTalking.src = '';
            avatarNormal.classList.remove('active');
            avatarTalking.classList.remove('active');
            
            if (isMicActive) {
                if (audioContext) audioContext.close();
                isMicActive = false;
                micBtn.textContent = "マイク開始";
                cancelAnimationFrame(animationId);
            }
        });

        // マイク音量解析と口パク切り替え
        micBtn.addEventListener('click', async () => {
            if (!isMicActive) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    microphone = audioContext.createMediaStreamSource(stream);
                    microphone.connect(analyser);
                    analyser.fftSize = 256;
                    const bufferLength = analyser.frequencyBinCount;
                    dataArray = new Uint8Array(bufferLength);

                    isMicActive = true;
                    micBtn.textContent = "マイク停止";
                    detectAudio();
                } catch (err) {
                    alert("マイクの許可が必要です。");
                }
            } else {
                if (audioContext) audioContext.close();
                isMicActive = false;
                micBtn.textContent = "マイク開始";
                cancelAnimationFrame(animationId);
                if (imageNormalSrc) {
                    avatarTalking.classList.remove('active');
                    avatarNormal.classList.add('active');
                }
            }
        });

        function detectAudio() {
            if (!isMicActive) return;
            animationId = requestAnimationFrame(detectAudio);
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            let average = sum / dataArray.length;

            if (average > 15) {
                if (imageTalkingSrc) {
                    avatarNormal.classList.remove('active');
                    avatarTalking.classList.add('active');
                }
            } else {
                if (imageNormalSrc) {
                    avatarTalking.classList.remove('active');
                    avatarNormal.classList.add('active');
                }
            }
        }
    </script>
</body>
</html>
