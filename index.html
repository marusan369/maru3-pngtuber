<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PNGTuber Mobile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #222;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .avatar-img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }
        .avatar-img.active {
            display: block;
        }
        #control-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            padding: 10px 15px;
            border-radius: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            z-index: 10;
            max-width: 95vw;
        }
        button, label {
            color: #fff;
            background: #ff69b4;
            padding: 8px 10px;
            border: none;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            font-family: sans-serif;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            text-align: center;
        }
        button:active, label:active {
            background: #ff1493;
        }
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div id="stage">
        <!-- アバター用画像 (3枚: 通常、喋り、まばたき) -->
        <img id="avatar-normal" class="avatar-img" alt="Normal">
        <img id="avatar-talking" class="avatar-img" alt="Talking">
        <img id="avatar-blink" class="avatar-img" alt="Blink">

        <!-- 操作パネル -->
        <div id="control-panel">
            <label>通常 <input type="file" id="loader-normal" accept="image/*"></label>
            <label>喋り <input type="file" id="loader-talking" accept="image/*"></label>
            <label>瞬き <input type="file" id="loader-blink" accept="image/*"></label>
            <button id="mic-btn">マイク開始</button>
            <button id="reset-btn">リセット</button>
        </div>
    </div>

    <script>
        const avatarNormal = document.getElementById('avatar-normal');
        const avatarTalking = document.getElementById('avatar-talking');
        const avatarBlink = document.getElementById('avatar-blink');
        
        const loaderNormal = document.getElementById('loader-normal');
        const loaderTalking = document.getElementById('loader-talking');
        const loaderBlink = document.getElementById('loader-blink');
        
        const micBtn = document.getElementById('mic-btn');
        const resetBtn = document.getElementById('reset-btn');

        let imageNormalSrc = '';
        let imageTalkingSrc = '';
        let imageBlinkSrc = '';
        
        let audioContext, analyser, microphone, dataArray;
        let isMicActive = false;
        let animationId;
        let blinkTimer = null;
        let isBlinking = false;

        // 通常画像の読み込み
        loaderNormal.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                imageNormalSrc = event.target.result;
                updateDisplayState();
            };
            reader.readAsDataURL(file);
        });

        // 喋り画像の読み込み
        loaderTalking.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                imageTalkingSrc = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // 瞬き画像の読み込み
        loaderBlink.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                imageBlinkSrc = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function updateDisplayState() {
            avatarNormal.classList.remove('active');
            avatarTalking.classList.remove('active');
            avatarBlink.classList.remove('active');

            if (imageNormalSrc) {
                avatarNormal.src = imageNormalSrc;
                avatarNormal.classList.add('active');
            }
            if (imageTalkingSrc) avatarTalking.src = imageTalkingSrc;
            if (imageBlinkSrc) avatarBlink.src = imageBlinkSrc;
        }

        // リセット処理
        resetBtn.addEventListener('click', () => {
            imageNormalSrc = '';
            imageTalkingSrc = '';
            imageBlinkSrc = '';
            loaderNormal.value = '';
            loaderTalking.value = '';
            loaderBlink.value = '';
            
            avatarNormal.src = '';
            avatarTalking.src = '';
            avatarBlink.src = '';
            
            avatarNormal.classList.remove('active');
            avatarTalking.classList.remove('active');
            avatarBlink.classList.remove('active');
            
            if (isMicActive) {
                if (audioContext) audioContext.close();
                isMicActive = false;
                micBtn.textContent = "マイク開始";
                cancelAnimationFrame(animationId);
            }
            stopBlinkLoop();
        });

        // ランダムまばたき制御
        function startBlinkLoop() {
            if (blinkTimer) return;
            const triggerBlink = () => {
                // 喋っている最中は瞬きさせない
                let isTalkingNow = avatarTalking.classList.contains('active');
                if (imageBlinkSrc && !isTalkingNow && imageNormalSrc) {
                    isBlinking = true;
                    avatarNormal.classList.remove('active');
                    avatarBlink.classList.add('active');
                    
                    setTimeout(() => {
                        isBlinking = false;
                        avatarBlink.classList.remove('active');
                        if (!avatarTalking.classList.contains('active') && imageNormalSrc) {
                            avatarNormal.classList.add('active');
                        }
                    }, 150); // 瞬きの持続時間 (0.15秒)
                }
                // 次の瞬きまでのランダムな時間 (2秒〜5秒おき)
                const nextTime = Math.random() * 3000 + 2000;
                blinkTimer = setTimeout(triggerBlink, nextTime);
            };
            blinkTimer = setTimeout(triggerBlink, 3000);
        }

        function stopBlinkLoop() {
            if (blinkTimer) {
                clearTimeout(blinkTimer);
                blinkTimer = null;
            }
            isBlinking = false;
        }

        // マイク音量解析と口パク切り替え
        micBtn.addEventListener('click', async () => {
            if (!isMicActive) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    microphone = audioContext.createMediaStreamSource(stream);
                    microphone.connect(analyser);
                    analyser.fftSize = 256;
                    const bufferLength = analyser.frequencyBinCount;
                    dataArray = new Uint8Array(bufferLength);

                    isMicActive = true;
                    micBtn.textContent = "マイク停止";
                    startBlinkLoop();
                    detectAudio();
                } catch (err) {
                    alert("マイクの許可が必要です。");
                }
            } else {
                if (audioContext) audioContext.close();
                isMicActive = false;
                micBtn.textContent = "マイク開始";
                cancelAnimationFrame(animationId);
                stopBlinkLoop();
                updateDisplayState();
            }
        });

        function detectAudio() {
            if (!isMicActive) return;
            animationId = requestAnimationFrame(detectAudio);
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            let average = sum / dataArray.length;

            // 喋っている判定（閾値は必要に応じて調整してね）
            if (average > 12) {
                if (imageTalkingSrc) {
                    avatarNormal.classList.remove('active');
                    avatarBlink.classList.remove('active');
                    avatarTalking.classList.add('active');
                }
            } else {
                if (!isBlinking && imageNormalSrc) {
                    avatarTalking.classList.remove('active');
                    avatarNormal.classList.add('active');
                }
            }
        }
    </script>
</body>
</html>
