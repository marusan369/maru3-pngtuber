<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>maruPNG</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #00ff00;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #00ff00;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
        }
        
        img.layer {
            position: absolute;
            width: 110%;
            height: 110%;
            object-fit: contain;
            pointer-events: none;
            transition: transform 0.05s ease-out, filter 0.15s ease;
            transform-origin: center bottom;
            display: none;
        }
        img.layer.active {
            display: block;
        }

        /* 無言の時にイラストを暗くするスタイル */
        body.dim-on-silence img.layer.is-dimmed {
            filter: brightness(0.5);
        }
        
        .hideable {
            transition: opacity 0.3s ease;
        }
        body.ui-hidden .hideable {
            opacity: 0;
            pointer-events: none;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 95vw;
            max-width: 480px;
            font-family: system-ui;
            display: flex;
            gap: 6px;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 15px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 10;
        }
        button, label {
            color: #fff;
            background: #ff69b4;
            padding: 8px 10px;
            border: none;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        button:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
        }
        button.toggle-off {
            background: #555;
            color: #aaa;
        }

        input[type="file"] {
            display: none;
        }
        .setting-group {
            display: flex;
            gap: 4px;
            align-items: center;
            color: white;
            font-size: 11px;
        }
        input[type="range"], input[type="number"] {
            width: 55px;
        }
        
        #meter {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80vw;
            max-width: 300px;
            height: 8px;
            background: #222;
            border-radius: 4px;
            overflow: hidden;
            z-index: 10;
        }
        #meter > div:last-child {
            height: 100%;
            width: 0%;
            background: lime;
            transition: width 0.05s ease-out;
        }
        #threshold-line {
            position: absolute;
            top: 0;
            height: 100%;
            width: 2px;
            background: red;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>

  <div class="stage" id="stage">
    <img id="img-idle" class="layer" alt="idle">
    <img id="img-active" class="layer" alt="active">
    <img id="img-blink" class="layer" alt="blink">
  </div>

  <div id="meter" class="hideable">
    <div id="threshold-line"></div>
    <div></div>
  </div>

  <div class="controls hideable">
    <button id="btnStart">Start Mic</button>
    <button id="btnStop" disabled>Stop</button>
    <button id="btnReset">Reset</button>
    <label>normal <input type="file" id="loader-idle" accept="image/*"></label>
    <label>talk <input type="file" id="loader-active" accept="image/*"></label>
    <label>blink <input type="file" id="loader-blink" accept="image/*"></label>
    <button id="btnBgColor" style="background: #008000;">background: Green</button>
    <button id="btnDimMode" class="toggle-off">Dim on Silence: OFF</button>
    <!-- ★ふわふわボタンをここに復活 -->
    <button id="btnFuwafuwa" class="toggle-off">Fuwafuwa: OFF</button>
    <div class="setting-group">
      Threshold:<input id="threshold" type="range" min="0.01" max="0.5" step="0.01" value="0.04">
    </div>
    <div class="setting-group">
      Hold:<input id="hold" type="number" min="100" max="5000" step="100" value="500">
    </div>
  </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    class MicMonitor {
        btnStart = document.getElementById('btnStart');
        btnStop = document.getElementById('btnStop');
        btnReset = document.getElementById('btnReset');
        btnBgColor = document.getElementById('btnBgColor');
        btnDimMode = document.getElementById('btnDimMode');
        btnFuwafuwa = document.getElementById('btnFuwafuwa'); // ★ふわふわボタンの取得を復活
        
        loaderIdle = document.getElementById('loader-idle');
        loaderActive = document.getElementById('loader-active');
        loaderBlink = document.getElementById('loader-blink');

        stage = document.getElementById('stage');
        imgIdle = document.getElementById('img-idle');
        imgActive = document.getElementById('img-active');
        imgBlink = document.getElementById('img-blink');

        meterFill = document.querySelector('#meter > div:last-child');
        thresholdLine = document.getElementById('threshold-line');
        thresholdInput = document.getElementById('threshold');
        holdInput = document.getElementById('hold');

        audioContext = null;
        analyser = null;
        sourceNode = null;
        stream = null;
        rafId = null;
        lastTrigger = 0;

        nextBlinkTime = 0;
        isBlinking = false;
        blinkEndTime = 0;

        bounceHeight = 20;
        maxTiltDegree = 3;

        bgColors = [
            { name: 'Green', color: '#00ff00', btnColor: '#008000' },
            { name: 'Blue',   color: '#0000ff', btnColor: '#0000cc' },
            { name: 'Magenta', color: '#ff00ff', btnColor: '#cc00cc' }
        ];
        currentBgIndex = 0;

        isDimModeEnabled = false;
        isFuwafuwaEnabled = false; // ★ふわふわの状態管理を復活

        constructor() {
            this.btnStart.addEventListener('click', () => this.startMic());
            this.btnStop.addEventListener('click', () => this.stopMic());
            this.btnReset.addEventListener('click', () => this.resetState());
            this.btnBgColor.addEventListener('click', () => this.cycleBgColor());
            this.btnDimMode.addEventListener('click', () => this.toggleDimMode());
            this.btnFuwafuwa.addEventListener('click', () => this.toggleFuwafuwa()); // ★クリックイベント登録を復活
            this.thresholdInput.addEventListener('input', () => this.updateThresholdLine());

            this.loaderIdle.addEventListener('change', (e) => this.loadImage(e, 'IDLE'));
            this.loaderActive.addEventListener('change', (e) => this.loadImage(e, 'ACTIVE'));
            this.loaderBlink.addEventListener('change', (e) => this.loadImage(e, 'BLINK'));

            this.stage.addEventListener('click', (e) => {
                if (e.target === this.stage || e.target.classList.contains('layer')) {
                    document.body.classList.toggle('ui-hidden');
                }
            });

            this.scheduleNextBlink();
            this.updateThresholdLine();
            this.updateAvatarAppearance(false, performance.now());
        }

        toggleDimMode() {
            this.isDimModeEnabled = !this.isDimModeEnabled;
            if (this.isDimModeEnabled) {
                document.body.classList.add('dim-on-silence');
                this.btnDimMode.classList.remove('toggle-off');
                this.btnDimMode.style.background = '#ff69b4';
                this.btnDimMode.textContent = 'Dim on Silence: ON';
            } else {
                document.body.classList.remove('dim-on-silence');
                this.btnDimMode.classList.add('toggle-off');
                this.btnDimMode.style.background = '';
                this.btnDimMode.textContent = 'Dim on Silence: OFF';
                document.querySelectorAll('img.layer').forEach(img => img.classList.remove('is-dimmed'));
            }
        }

        // ★ふわふわ切り替えメソッドを復活
        toggleFuwafuwa() {
            this.isFuwafuwaEnabled = !this.isFuwafuwaEnabled;
            if (this.isFuwafuwaEnabled) {
                this.btnFuwafuwa.classList.remove('toggle-off');
                this.btnFuwafuwa.style.background = '#ff69b4';
                this.btnFuwafuwa.textContent = 'Fuwafuwa: ON';
            } else {
                this.btnFuwafuwa.classList.add('toggle-off');
                this.btnFuwafuwa.style.background = '';
                this.btnFuwafuwa.textContent = 'Fuwafuwa: OFF';
                document.querySelectorAll('img.layer').forEach(img => {
                    if (!img.classList.contains('active') || !this.isSpeakingState) {
                        img.style.transform = 'translateY(0px) rotate(0deg)';
                    }
                });
            }
        }

        cycleBgColor() {
            this.currentBgIndex = (this.currentBgIndex + 1) % this.bgColors.length;
            const current = this.bgColors[this.currentBgIndex];
            
            document.body.style.background = current.color;
            this.stage.style.backgroundColor = current.color;
            this.btnBgColor.style.background = current.btnColor;
            this.btnBgColor.textContent = `background: ${current.name}`;
        }

        loadImage(e, type) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                if (type === 'IDLE') {
                    this.imgIdle.src = event.target.result;
                    this.imgIdle.classList.add('active');
                } else if (type === 'ACTIVE') {
                    this.imgActive.src = event.target.result;
                } else if (type === 'BLINK') {
                    this.imgBlink.src = event.target.result;
                }
            };
            reader.readAsDataURL(file);
        }

        rmsFromTimeDomain(buf) {
            let sum = 0;
            for (let i = 0; i < buf.length; i++) {
                sum += buf[i] * buf[i];
            }
            return Math.sqrt(sum / buf.length);
        }

        scheduleNextBlink() {
            const randomSec = 2000 + Math.random() * 3000;
            this.nextBlinkTime = performance.now() + randomSec;
        }

        updateAvatarAppearance(isSpeaking, now) {
            this.imgIdle.classList.remove('active');
            this.imgActive.classList.remove('active');
            this.imgBlink.classList.remove('active');

            const hasIdle = !!this.imgIdle.getAttribute('src');
            const hasActive = !!this.imgActive.getAttribute('src');
            const hasBlink = !!this.imgBlink.getAttribute('src');

            if (isSpeaking) {
                this.isBlinking = false;
                const toggleInterval = 300;
                const shouldBeActive = Math.floor(now / toggleInterval) % 2 === 0;

                if (shouldBeActive && hasActive) {
                    this.imgActive.classList.add('active');
                } else if (hasIdle) {
                    this.imgIdle.classList.add('active');
                } else if (hasActive) {
                    this.imgActive.classList.add('active');
                }
            } else {
                if (!this.isBlinking && now >= this.nextBlinkTime && hasBlink) {
                    this.isBlinking = true;
                    this.blinkEndTime = now + 120;
                }

                if (this.isBlinking && now >= this.blinkEndTime) {
                    this.isBlinking = false;
                    this.scheduleNextBlink();
                }

                if (this.isBlinking && hasBlink) {
                    this.imgBlink.classList.add('active');
                } else if (hasIdle) {
                    this.imgIdle.classList.add('active');
                }
            }

            document.querySelectorAll('img.layer').forEach(img => {
                if (!isSpeaking && this.isDimModeEnabled) {
                    img.classList.add('is-dimmed');
                } else {
                    img.classList.remove('is-dimmed');
                }
            });
        }

        updateThresholdLine() {
            const thresholdValue = Number(this.thresholdInput.value);
            const posPct = Math.min(1, thresholdValue * 3) * 100;
            this.thresholdLine.style.left = posPct + '%';
        }

        monitorLoop = () => {
            if (!this.analyser) return;
            const buf = new Float32Array(this.analyser.fftSize);
            this.analyser.getFloatTimeDomainData(buf);

            const level = this.rmsFromTimeDomain(buf);
            const meterPct = Math.min(1, level * 3);

            this.meterFill.style.width = (meterPct * 100) + '%';

            const holdMs = Number(this.holdInput.value);
            const threshold = Number(this.thresholdInput.value);
            const now = performance.now();

            let isSpeaking = false;
            if (level > threshold) {
                this.lastTrigger = now;
                isSpeaking = true;
            } else {
                if (now - this.lastTrigger <= holdMs) {
                    isSpeaking = true;
                }
            }

            this.isSpeakingState = isSpeaking;
            this.updateAvatarAppearance(isSpeaking, now);

            const currentActiveLayer = document.querySelector('img.layer.active');
            
            // ★ふわふわの上下動計算を復活
            let fuwaY = 0;
            if (this.isFuwafuwaEnabled) {
                fuwaY = Math.sin(now / 400) * 6;
            }

            if (currentActiveLayer) {
                if (isSpeaking) {
                    const translateY = (meterPct * -this.bounceHeight) + fuwaY;
                    const tilt = Math.sin(now / 80) * (meterPct * this.maxTiltDegree);
                    currentActiveLayer.style.transform = `translateY(${translateY}px) rotate(${tilt}deg)`;
                } else {
                    currentActiveLayer.style.transform = `translateY(${fuwaY}px) rotate(0deg)`;
                }
            }

            this.rafId = requestAnimationFrame(this.monitorLoop);
        }

        async startMic() {
            if (this.audioContext && this.audioContext.state === 'running') return;
            try {
                this.stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        automaticGainControl: false,
                        noiseSuppression: false,
                        echoCancellation: false
                    }
                });
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (this.audioContext.state === 'suspended') {
                    await this.audioContext.resume();
                }
                this.sourceNode = this.audioContext.createMediaStreamSource(this.stream);
                this.analyser = this.audioContext.createAnalyser();
                this.analyser.fftSize = 2048;
                this.sourceNode.connect(this.analyser);
                this.monitorLoop();

                this.btnStart.disabled = true;
                this.btnStop.disabled = false;
                this.btnStart.textContent = 'Listening...';
            } catch (e) {
                alert('Error: ' + e);
            }
        }

        stopMic() {
            if (this.rafId) {
                cancelAnimationFrame(this.rafId);
                this.rafId = null;
            }
            if (this.stream) {
                this.stream.getTracks().forEach(track => track.stop());
                this.stream = null;
            }
            if (this.audioContext) {
                this.audioContext.close();
                this.audioContext = null;
            }
            this.analyser = null;
            this.sourceNode = null;

            this.meterFill.style.width = '0%';
            document.querySelectorAll('img.layer').forEach(img => {
                img.style.transform = 'translateY(0px) rotate(0deg)';
                img.classList.remove('is-dimmed');
            });
            this.updateAvatarAppearance(false, performance.now());

            this.btnStart.disabled = false;
            this.btnStop.disabled = true;
            this.btnStart.textContent = 'Start Mic';
        }

        resetState() {
            this.stopMic();
            this.loaderIdle.value = '';
            this.loaderActive.value = '';
            this.loaderBlink.value = '';

            this.imgIdle.src = '';
            this.imgActive.src = '';
            this.imgBlink.src = '';

            this.currentBgIndex = 0;
            const current = this.bgColors[0];
            document.body.style.background = current.color;
            this.stage.style.backgroundColor = current.color;
            this.btnBgColor.style.background = current.btnColor;
            this.btnBgColor.textContent = `background: ${current.name}`;

            if (this.isDimModeEnabled) {
                this.toggleDimMode();
            }
            if (this.isFuwafuwaEnabled) {
                this.toggleFuwafuwa();
            }

            this.imgIdle.classList.remove('active');
            this.imgActive.classList.remove('active');
            this.imgBlink.classList.remove('active');

            this.thresholdInput.value = 0.04;
            this.holdInput.value = 500;
            this.updateThresholdLine();
            this.isBlinking = false;
            this.scheduleNextBlink();
        }
    }
    new MicMonitor();
});
</script>
</body>
</html>
